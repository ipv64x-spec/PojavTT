# This is a root-level, build-wide setting (not a per-version mod property -
# each versions/<x>/gradle.properties has its own separate set of those).
#
# Without this, Gradle configures EVERY subproject listed in settings.gradle
# before running any task at all - meaning a single bad dependency version in
# just ONE version module (e.g. versions/1.21.3) fails the build for ALL 12
# version modules, even ones that were never touched. With this on, running
# `./gradlew :1.21.11:build` only configures the 1.21.11 project, so one
# broken version module can no longer take the other 11 down with it.
org.gradle.configureondemand=true
