# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties (Minecraft 1.21)
# BEST-EFFORT values - verify against https://fabricmc.net/develop if Loom
# reports a missing/invalid yarn_mappings, loader_version, or fabric_version.
# Loom errors list the valid options directly when one of these is wrong.
minecraft_version=1.21
yarn_mappings=1.21+build.9
loader_version=0.16.9
loom_version=1.8-SNAPSHOT
# (bumped from 1.7-SNAPSHOT: confirmed via CI that 1.7-SNAPSHOT's Loom is
# incompatible with Gradle 9.6.1's newer Problems API - 1.8-SNAPSHOT, the
# same line 1.21.2 already uses successfully, fixes this. Loom's own
# version is independent of which Minecraft version it targets.)

# Mod Properties
mod_version=1.21
maven_group=com.pojavtiers
archives_base_name=pojavtiertagger

# Dependencies
fabric_version=0.100.8+1.21
modmenu_version=11.0.3
