name: Build PojavTierTagger (all versions)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual runs from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false   # one version failing to build shouldn't cancel the others
      matrix:
        mc_version:
          - "1.21"
          - "1.21.1"
          - "1.21.2"
          - "1.21.3"
          - "1.21.4"
          - "1.21.5"
          - "1.21.6"
          - "1.21.7"
          - "1.21.8"
          - "1.21.9"
          - "1.21.10"
          - "1.21.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ matrix.mc_version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.mc_version }}-
            ${{ runner.os }}-gradle-

      - name: Build ${{ matrix.mc_version }}
        run: ./gradlew ":${{ matrix.mc_version }}:build" --configure-on-demand

      - name: Upload built jar for ${{ matrix.mc_version }}
        uses: actions/upload-artifact@v4
        with:
          name: PojavTierTagger-${{ matrix.mc_version }}
          path: versions/${{ matrix.mc_version }}/build/libs/*.jar
          if-no-files-found: error
